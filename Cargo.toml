[package]
name = "jizura-aviutl2"
version = "0.3.1"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aviutl2 = { path = "../aviutl2-rs-main/crates/aviutl2", default-features = false, features = ["filter", "generic"] }
aviutl2-sys = { path = "../aviutl2-rs-main/crates/aviutl2-sys" }
anyhow = "1"
serde_json = "1"
base64 = "0.23"
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 2
